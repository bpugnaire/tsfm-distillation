# Stage C8 pilot (owner 2026-11-20, ADR 0008): multi-token decoder vs single query token.
# Same 300k windows and Timestral-28M labels as C2's kd_v2_300k (cache reused), same student m size, same 15k steps:
# only the architecture changes. Early stopping off so both arms run the full schedule (the reference did).
name: stage_c8_mt
base: configs/train/study_base_m.yaml
teacher: timestral-28m
reference_arm: c2_single_300k
eval_suites: [shapes, multidomain_test, fresh_fr_power]
arms:
  - {name: c2_single_300k, type: existing, run: "stage_c2:kd_v2_300k"}
  - {name: kd_mt_300k, mix: {synth: 150000, multidomain_v2: 150000}, alpha: 1.0,
     override: {student: {arch: patch_transformer_mt}, optim: {patience: 1000}}}
pairs:
  - [kd_mt_300k, c2_single_300k, "multi-token decoder vs single query token (same 300k windows, same labels)"]
  - [kd_mt_300k, "zoo:toto-2.0-4m", "multi-token student vs Toto-2.0-4m zero-shot"]
  - [kd_mt_300k, "zoo:timestral-5m", "multi-token student vs Timestral-5M zero-shot"]
