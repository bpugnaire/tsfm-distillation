# Stage C2 (cheap version, owner 2026-11-14): push DATA for a student that stays under 1M parameters (student m, 0.95M).
# Teacher: Timestral-28M (4x faster labelling; zero-shot on electricity it scores like the 209M: 0.615 vs 0.614).
# Data v2: + ~45 GiftEvalPretrain subsets (energy included, retail and fev-overlapping energy excluded), minus the 4 GIFT-Eval
# test datasets, series-level contamination filter vs GIFT-Eval/fev tests and our target series, no near-duplicate windows
# (tinycast/data/sources/data_v2.py). Same validation set as every earlier stage. 1 seed (exploratory).
# Same passes over the data in every arm (~13): 15k steps x 256 for 300k windows, 50k steps for 1M.
name: stage_c2
base: configs/train/study_base_m.yaml
teacher: timestral-28m
reference_arm: kd_old_28m
eval_suites: [shapes, multidomain_test, fresh_fr_power]
arms:
  - {name: clite_ref, type: existing, run: "stage_c_lite:kd_mix_m_300k"}
  - {name: kd_old_28m, mix: {synth: 150000, multidomain: 150000}, alpha: 1.0}
  - {name: kd_v2_300k, mix: {synth: 150000, multidomain_v2: 150000}, alpha: 1.0}
  - {name: kd_v2_1m, mix: {synth: 500000, multidomain_v2: 500000}, alpha: 1.0,
     override: {optim: {max_steps: 50000, warmup_steps: 1000, eval_every: 2500}}}
pairs:
  - [kd_old_28m, clite_ref, "teacher: Timestral-28M vs 209M labels (same old data)"]
  - [kd_v2_300k, kd_old_28m, "data v2 vs old data (300k, same teacher)"]
  - [kd_v2_1m, kd_v2_300k, "1M vs 300k windows (data v2)"]
  - [kd_v2_1m, clite_ref, "C2 best vs C-lite (overall)"]
  - [kd_v2_1m, "zoo:toto-2.0-4m", "student (v2, 1M) vs Toto 2.0 4m zero-shot"]
  - [kd_v2_1m, "zoo:timestral-5m", "student (v2, 1M) vs Timestral-5M zero-shot"]
  - [kd_v2_1m, "zoo:timestral-28m", "student (v2, 1M) vs its teacher Timestral-28M"]
