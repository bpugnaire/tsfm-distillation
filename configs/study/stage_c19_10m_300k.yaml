# Stage C19 (owner 2026-11-23): C17's 10M windows (same corpus and Timestral-5M labels, cached) trained 2x longer: 300k steps,
# fresh cosine schedule. Did C17 run out of steps rather than out of things to learn? If it gains, the clean control is
# 3M windows at 300k steps (not run yet): only that separates more data from more compute.
name: stage_c19_10m_300k
base: configs/train/study_base_m.yaml
teacher: timestral-5m
reference_arm: kd5m_3m
eval_suites: [shapes, multidomain_test, fresh_fr_power]
arms:
  - {name: kd5m_3m, type: existing, run: "stage_c15_3m:kd5m_3m"}
  - {name: kd5m_10m, type: existing, run: "stage_c17_10m:kd5m_10m"}
  - {name: kd5m_10m_300k, mix: {synth: 5000000, multidomain_v4: 5000000}, alpha: 1.0,
     override: {student: {arch: patch_transformer_mt}, data: {gt_sources: []},
                optim: {max_steps: 300000, warmup_steps: 2000, eval_every: 10000, patience: 1000}}}
pairs:
  - [kd5m_10m_300k, kd5m_10m, "10M windows: 300k vs 150k steps"]
  - [kd5m_10m_300k, kd5m_3m, "10M windows 300k steps vs 3M windows 150k steps (more data AND more compute)"]
  - [kd5m_10m_300k, "zoo:toto-2.0-4m", "vs Toto-2.0-4m"]
  - [kd5m_10m_300k, "zoo:timestral-5m", "vs its teacher Timestral-5M"]
