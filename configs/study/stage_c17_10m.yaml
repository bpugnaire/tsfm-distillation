# Stage C17 (night 2026-11-22/23, owner): 10M windows (5M synthetic + 5M data v4), Timestral-5M labels, multi-token student m,
# 512 steps, 150k steps = the SAME compute as C15's kd5m_3m (3M windows): the question is more distinct data at equal compute.
# Memory-mapped corpus (20 GB) and labels (33 GB). Target: pure teacher labels, or the hybrid (real future on synthetic
# windows) if the C16 pilot beat pure distillation on GIFT-Eval with its 95% interval below 1 (rule fixed before the result;
# runs/c17_decision.txt records what was chosen).
name: stage_c17_10m
base: configs/train/study_base_m.yaml
teacher: timestral-5m
reference_arm: kd5m_3m
eval_suites: [shapes, multidomain_test, fresh_fr_power]
arms:
  - {name: kd5m_3m, type: existing, run: "stage_c15_3m:kd5m_3m"}
  - {name: kd5m_10m, mix: {synth: 5000000, multidomain_v4: 5000000}, alpha: 1.0,
     override: {student: {arch: patch_transformer_mt}, data: {gt_sources: []},
                optim: {max_steps: 150000, warmup_steps: 2000, eval_every: 5000, patience: 1000}}}
pairs:
  - [kd5m_10m, kd5m_3m, "10M vs 3M windows, same compute (150k steps), Timestral-5M labels"]
  - [kd5m_10m, "zoo:toto-2.0-4m", "10M-window student vs Toto-2.0-4m zero-shot"]
  - [kd5m_10m, "zoo:timestral-5m", "10M-window student vs its teacher Timestral-5M"]
