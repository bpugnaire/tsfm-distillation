# Stage C13 (night 2026-11-21, owner): does distillation still beat training on the real future as data grows?
# Multi-token student m, 512 steps, batch 256, full schedules (15k steps at 300k windows, 50k at 1M: ~13 passes each).
# Same windows per size; only the target changes: alpha 0 = real future (GT), 0.5 = mix, 1 = Timestral-28M quantiles (KD,
# existing runs C8 and C9). Busbridge et al. 2025 predict the KD advantage shrinks with data; this measures it for a 1M
# forecaster. Labels are cached for both sizes.
name: stage_c13_gt_vs_kd
base: configs/train/study_base_m.yaml
teacher: timestral-28m
reference_arm: kd_1m
eval_suites: [shapes, multidomain_test, fresh_fr_power]
arms:
  - {name: kd_300k, type: existing, run: "stage_c8_mt:kd_mt_300k"}
  - {name: kd_1m, type: existing, run: "stage_c9_mt_scale:mt_1m"}
  - {name: gt_300k, mix: {synth: 150000, multidomain_v2: 150000}, alpha: 0.0,
     override: {student: {arch: patch_transformer_mt}, optim: {patience: 1000}}}
  - {name: mix_300k, mix: {synth: 150000, multidomain_v2: 150000}, alpha: 0.5,
     override: {student: {arch: patch_transformer_mt}, optim: {patience: 1000}}}
  - {name: gt_1m, mix: {synth: 500000, multidomain_v2: 500000}, alpha: 0.0,
     override: {student: {arch: patch_transformer_mt}, optim: {max_steps: 50000, warmup_steps: 1000, eval_every: 2500, patience: 1000}}}
  - {name: mix_1m, mix: {synth: 500000, multidomain_v2: 500000}, alpha: 0.5,
     override: {student: {arch: patch_transformer_mt}, optim: {max_steps: 50000, warmup_steps: 1000, eval_every: 2500, patience: 1000}}}
pairs:
  - [kd_300k, gt_300k, "300k windows: teacher labels vs real future"]
  - [mix_300k, gt_300k, "300k windows: 50/50 mix vs real future"]
  - [kd_1m, gt_1m, "1M windows: teacher labels vs real future"]
  - [mix_1m, gt_1m, "1M windows: 50/50 mix vs real future"]
  - [gt_1m, gt_300k, "real future: 1M vs 300k windows"]
  - [kd_1m, kd_300k, "teacher labels: 1M vs 300k windows"]
