# Stage C10 pilot 1 (owner 2026-11-21): data v3 vs v2. Multi-token student m, 512 steps, 300k windows (150k synthetic,
# same seeds, + 150k real), Timestral-28M labels, 15k steps, no early stopping. Reference: C8's kd_mt_300k (data v2).
name: stage_c10_v3
base: configs/train/study_base_m.yaml
teacher: timestral-28m
reference_arm: c8_mt_v2_300k
eval_suites: [shapes, multidomain_test, fresh_fr_power]
arms:
  - {name: c8_mt_v2_300k, type: existing, run: "stage_c8_mt:kd_mt_300k"}
  - {name: mt_v3_300k, mix: {synth: 150000, multidomain_v3: 150000}, alpha: 1.0,
     override: {student: {arch: patch_transformer_mt}, optim: {patience: 1000}}}
pairs:
  - [mt_v3_300k, c8_mt_v2_300k, "data v3 vs v2 (multi-token, 300k windows, same labels teacher)"]
