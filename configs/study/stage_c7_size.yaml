# Stage C7 (owner 2026-11-19): is the student the bottleneck (capacity gap)? A 2.9M student (d_model 192, 6 layers,
# 6 heads; "l") trained on the same 1M windows with Timestral-28M and Timestral-209M labels (both caches exist), 512 steps,
# full 50k steps. If 209M labels help the l student but not the m one (C5a: tie), the small student is the limit.
name: stage_c7_size
base: configs/train/study_base_m.yaml
teacher: timestral-28m
reference_arm: m_28m
eval_suites: [shapes, multidomain_test, fresh_fr_power]
arms:
  - {name: m_28m, type: existing, run: "stage_c2:kd_v2_1m"}
  - {name: m_209m, type: existing, run: "stage_c5_209m:kd_209m_1m_full"}
  - {name: l_28m, mix: {synth: 500000, multidomain_v2: 500000}, alpha: 1.0,
     override: {student: {d_model: 192, n_layers: 6, n_heads: 6},
                optim: {max_steps: 50000, warmup_steps: 1000, eval_every: 2500, patience: 1000}}}
  - {name: l_209m, mix: {synth: 500000, multidomain_v2: 500000}, alpha: 1.0, teacher: timestral-209m,
     override: {student: {d_model: 192, n_layers: 6, n_heads: 6},
                optim: {max_steps: 50000, warmup_steps: 1000, eval_every: 2500, patience: 1000}}}
pairs:
  - [l_209m, l_28m, "teacher 209M vs 28M, student l (2.9M)"]
  - [m_209m, m_28m, "teacher 209M vs 28M, student m (0.95M)"]
  - [l_28m, m_28m, "student l vs m, Timestral-28M labels"]
  - [l_209m, m_209m, "student l vs m, Timestral-209M labels"]
  - [l_209m, "zoo:toto-2.0-4m", "l student (209M labels) vs Toto-2.0-4m zero-shot"]
