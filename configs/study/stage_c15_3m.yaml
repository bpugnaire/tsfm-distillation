# Stage C15 (night 2026-11-22, owner): does data volume keep adding on top of distillation? 3M windows (1.5M synthetic +
# 1.5M data v2), 512 steps, multi-token student m, batch 256 (fastest on this Mac: 2026-11-22 benchmark), 150k steps =
# ~13 passes, the same as the 300k (15k) and 1M (50k) runs. Real future vs Timestral-5M labels (the best teacher at 1M, C14).
# Corpus and labels are memory-mapped (6 GB contexts, 10 GB labels). Curves with C13/C14: 300k, 1M, 3M windows.
name: stage_c15_3m
base: configs/train/study_base_m.yaml
teacher: timestral-5m
reference_arm: kd5m_1m
eval_suites: [shapes, multidomain_test, fresh_fr_power]
arms:
  - {name: kd5m_1m, type: existing, run: "stage_c14_teacher5m:kd5m_1m"}
  - {name: gt_1m, type: existing, run: "stage_c13_gt_vs_kd:gt_1m"}
  - {name: gt_3m, mix: {synth: 1500000, multidomain_v2: 1500000}, alpha: 0.0,
     override: {student: {arch: patch_transformer_mt}, optim: {max_steps: 150000, warmup_steps: 2000, eval_every: 5000, patience: 1000}}}
  - {name: kd5m_3m, mix: {synth: 1500000, multidomain_v2: 1500000}, alpha: 1.0,
     override: {student: {arch: patch_transformer_mt}, optim: {max_steps: 150000, warmup_steps: 2000, eval_every: 5000, patience: 1000}}}
pairs:
  - [kd5m_3m, gt_3m, "3M windows: Timestral-5M labels vs real future"]
  - [kd5m_3m, kd5m_1m, "teacher labels: 3M vs 1M windows"]
  - [gt_3m, gt_1m, "real future: 3M vs 1M windows"]
  - [kd5m_3m, "zoo:toto-2.0-4m", "3M-window student vs Toto-2.0-4m zero-shot"]
  - [kd5m_3m, "zoo:timestral-5m", "3M-window student vs its teacher Timestral-5M"]
