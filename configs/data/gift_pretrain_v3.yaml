# Data v3 (owner 2026-11-21: "include a bit more data"): the 46 v2 subsets (same rules, see gift_pretrain_v2.yaml) +
# 18 more GiftEvalPretrain subsets (~13 GB). Still excluded: retail; fev test tasks (bull, cockatoo, hog, pdb, gfc12/14/17,
# kdd2022); pedestrian_counts; duplicates of chronos datasets we load; the very large buildings_900k / cmip6 / era5 / borg /
# azure (size, for now). Every series is checked against GIFT-Eval + fev + our targets (series-level filter).
# Caps per subset: max_series series, then max_points time points (random series dropped until it fits).
repo: Salesforce/GiftEvalPretrain
max_series: 20000
max_points: 15000000
subsets:
  # web
  wiki-rolling_nips: web
  kaggle_web_traffic_weekly: web
