<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tinycast · Project status</title>
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    .phase { padding: 10px 0; border-bottom: 1px solid var(--grid); }
    .phase summary { cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) 180px 60px; gap: 12px; align-items: center; list-style: none; }
    .phase summary::-webkit-details-marker { display: none; }
    .bar { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; display: flex; gap: 2px; }
    .bar span { display: block; height: 100%; border-radius: 4px; }
    .items { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; }
    .items li { padding: 3px 0 3px 22px; position: relative; color: var(--ink-2); }
    .items li::before { position: absolute; left: 2px; top: 3px; font-weight: 700; }
    .items li.done::before { content: "✓"; color: var(--student); }
    .items li.todo::before { content: "○"; color: var(--muted); }
    .items li.superseded::before { content: "↷"; color: var(--teacher); }
    .items li.done { color: var(--ink); }
    .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 8px 0 2px; }
    .decision { padding: 10px 0; border-bottom: 1px solid var(--grid); }
    .decision .q { font-weight: 600; }
    @media (max-width: 640px) { .phase summary { grid-template-columns: 1fr 70px 44px; } }
  </style>
</head>
<body>
  <main>
    <h1>Project status</h1>
    <p class="lede" id="focus"></p>
    <div class="kpis" id="kpis"></div>
    <h2>Phases</h2>
    <p class="small muted">Parsed from <code>PLAN.md</code> checkboxes. Click a phase for its items. ✓ done · ○ to do · ↷ superseded by a finding.</p>
    <div class="card" id="phases"></div>
    <div class="row" style="align-items:flex-start; gap:16px; margin-top:8px">
      <div style="flex:1 1 420px"><h2>Waiting for your decision</h2><div class="card" id="pending"></div></div>
      <div style="flex:1 1 420px"><h2>Decided</h2><div class="card" id="decided"></div>
        <h2>Latest journal entries</h2><div class="card small" id="journal"></div>
        <h2>Shipped model files</h2><div class="card small" id="models"></div></div>
    </div>
  </main>
  <script type="module" src="/src/pages/status.ts"></script>
</body>
</html>
