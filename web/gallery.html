<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tinycast · Shapes gallery</title>
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    .grid { display: grid; gap: 4px; align-items: stretch; }
    .grid .hd { font-size: 12px; color: var(--ink-2); padding: 4px; line-height: 1.3; }
    .grid .hd b { color: var(--ink); font-weight: 600; display: block; }
    .grid .rowlabel { font-size: 12px; color: var(--ink-2); padding: 4px 6px 0 0; }
    .cell { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px; cursor: pointer; }
    .cell:hover { border-color: var(--student); }
    .cell.best { box-shadow: inset 0 0 0 2px var(--ink-2); }
    .cell .m { font-size: 11px; color: var(--muted); padding: 0 3px; font-variant-numeric: tabular-nums; }
    .cell.best .m { color: var(--ink); font-weight: 600; }
    .scroller { overflow-x: auto; padding-bottom: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Shapes gallery</h1>
    <p class="lede">20 canonical shapes × every model, all forecasting the same 512-step context 64 steps ahead.
      Dashed: what actually happened. Each cell shows its WQL (lower is better); the framed cell is the best in its row.
      Click a row to open the shape in Draw mode.</p>
    <div class="row small" style="margin-bottom:10px">
      <span class="muted">Sort columns by</span>
      <button id="s-default" aria-pressed="true">model family</button>
      <button id="s-acc" aria-pressed="false">accuracy</button>
      <button id="s-speed" aria-pressed="false">CPU latency</button>
      <span class="muted" id="legend"></span>
    </div>
    <div class="scroller"><div id="grid" class="grid"></div></div>
    <p class="small muted" id="foot"></p>
  </main>
  <script type="module" src="/src/pages/gallery.ts"></script>
</body>
</html>
