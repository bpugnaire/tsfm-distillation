[project]
name = "tinycast"
version = "0.1.0"
description = "Distilling time-series foundation models into a tiny probabilistic forecaster that runs in the browser."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=2.0,<3",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16",
    "scipy>=1.13",
    "statsforecast>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "onnx>=1.16",
    "onnxruntime>=1.19",
]

[project.optional-dependencies]
# Teachers / comparators. Versions pinned after reading their sources (docs/notes/teacher-apis.md).
teachers = [
    "toto-2==2.0.0",                 # Toto 2.0 (`from toto2 import Toto2Model`); NOT toto-ts (that is Toto 1.0)
    "tfc-t0[torch]==0.6.1",          # t0 (weights gated on HF: needs HF_TOKEN)
    "chronos-forecasting==2.3.2",    # comparator only
    "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",  # comparator; weights: Modified MIT (owner OK 2026-11-13, personal project)
    "setuptools<81",                 # lightning (via gluonts via toto2) still imports pkg_resources
    "jaxtyping>=0.3",                # t0 annotates with TypeVars; jaxtyping 0.2.x raises at import
]
tracking = ["wandb>=0.18"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "pre-commit>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tinycast"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md", "*.ipynb", "web"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501", "UP047"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow tests (teacher loading, onnx parity, overfit)"]
addopts = "-m 'not slow'"

