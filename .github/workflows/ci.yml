name: ci
on:
  push:
    paths-ignore: ["docs/**", "results/**", "**/*.md", "web/public/data/**"]
  pull_request:
concurrency:  # a newer push cancels the older run instead of queueing both
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --python 3.12
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
