# Hand-maintained project status for the website Status page (web/status.html).
# Phase progress is NOT here: it is parsed from PLAN.md checkboxes by scripts/build_web_data.py.
current_focus: >-
  Distillation study design (ADR 0005, proposed): which inputs (real multi-domain, synthetic, teacher rollouts) and
  which teachers give the best small student. Stage A (~30 min) waits for approval. Electricity is the final demonstrator only.
pending_decisions:
  - id: approve-stage-a
    question: Approve Stage A of the distillation study (input sources, ~30 min on the Mac GPU)?
    note: docs/decisions/0005-distillation-study-design.md
  - id: fair-comparison
    question: How do we compare an in-domain student with zero-shot teachers fairly?
    options: [report both explicitly, also train a synthetic-only student, evaluate on a held-out domain]
  - id: input-distribution
    question: Which contexts do we label with the teachers (real windows, synthetic, teacher-generated, a mix)?
    options: [real RTE windows, KernelSynth + shapes, mix with a ratio to sweep]
    note: results/input_families.json shows white noise carries almost no teacher signal.
  - id: corpus-size
    question: How many cached windows per teacher (30k / 100k / 300k)?
    note: ~24-28 min per 300k windows per teacher on the Mac GPU (results/throughput.json). Needs approval before running.
  - id: teacher-choice
    question: Which teacher(s)? Per level (native tails) or per window (weighting by error)?
  - id: seeds-power
    question: How many seeds, and which effect size can the fresh split detect?
  - id: fresh-split
    question: Review ADR 0003 (fresh test starts 2026-10-15, ~4 weeks of data).
